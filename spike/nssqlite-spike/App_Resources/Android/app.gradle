// You can add your native dependencies here
dependencies {
//  implementation 'androidx.multidex:multidex:2.0.1'
    // the SQLite library the plugin loads on Android (exports the sqlite3_* API): androidx sqlite-bundled
    implementation 'androidx.sqlite:sqlite-bundled:2.7.1'
    // more engines for the engine tests: SQLCipher (libsqlcipher.so)
    implementation 'net.zetetic:sqlcipher-android:4.19.1@aar'
    implementation 'androidx.sqlite:sqlite:2.5.0'
}

android {
  // a custom SQLite build (libsqlite_custom.so) and a loadable extension (libns_ext.so), built by native/build-custom-sqlite.sh
  sourceSets {
    main {
      jniLibs.srcDir "${rootProject.projectDir}/../../App_Resources/Android/custom-libs"
    }
  }
  compileSdkVersion 36
  buildToolsVersion "36"
  // ndkVersion ""

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36

    // Version Information
    versionCode 1
    versionName "1.0.0"
    
    generatedDensities = []
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
